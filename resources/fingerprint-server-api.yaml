      required:
        - name
      properties:
        name:
          type: string
    GeolocationCountry:
      type: object
      additionalProperties: false
      required:
        - code
        - name
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 2
        name:
          type: string
    GeolocationContinent:
      type: object
      additionalProperties: false
      required:
        - code
        - name
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 2
        name:
          type: string
    GeolocationSubdivision:
